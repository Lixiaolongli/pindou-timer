<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>拼豆计时器</title>
<style>
:root{--c1:#d48080;--c2:#e8a87c;--c3:#6a9fb5;--c4:#c8a8d0;--bg:#faf7f2;--card:#fff;--text:#3a3a3a;--muted:#8a8078;--border:#ebe3d8;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.06);--radius:16px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);background-image:radial-gradient(circle at 15% 10%,rgba(212,128,128,.06) 0%,transparent 50%),radial-gradient(circle at 85% 90%,rgba(200,168,208,.06) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(106,159,181,.04) 0%,transparent 50%)}
.page{display:none;padding:20px 16px;max-width:480px;margin:0 auto}
.page.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.header{padding:36px 0 16px;text-align:center;position:relative}
.header::after{content:'';display:block;width:40px;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:2px;margin:16px auto 0;opacity:.6}
.header h1{font-size:1.5em;font-weight:800;color:var(--c1);letter-spacing:.5px;margin-bottom:6px}
.header .sub{font-size:.8em;color:var(--muted);font-weight:400}
.card{background:var(--card);border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.08)}
.card-title{font-size:.8em;color:var(--muted);margin-bottom:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.card-title::before{content:'· ';color:var(--c1)}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:1em;background:#fafaf8;outline:0;margin-top:10px;transition:border-color .2s,box-shadow .2s;color:var(--text)}
input:focus,select:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(212,128,128,.12)}
input::placeholder{color:#c5bdb5}
.btn{width:100%;padding:14px;border:0;border-radius:var(--radius-sm);font-size:1em;font-weight:600;cursor:pointer;margin-top:14px;transition:all .15s;letter-spacing:.5px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--c1),#c57070);color:#fff;box-shadow:0 3px 12px rgba(212,128,128,.3)}
.btn-primary:hover{box-shadow:0 4px 18px rgba(212,128,128,.4);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.97)}
.btn-outline{background:var(--card);color:var(--c1);border:1.5px solid var(--c1);font-weight:500}
.btn-outline:hover{background:rgba(212,128,128,.04)}
.btn-sm{padding:7px 12px;font-size:.78em;width:auto;margin-top:4px;border-radius:8px}
.btn-danger{color:#d9534f;border:1.5px solid #d9534f;background:var(--card)}
.btn-danger:hover{background:rgba(217,83,79,.04)}
.timer-display{text-align:center;padding:32px 0 20px}
.timer-number{font-size:4.2em;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);font-feature-settings:"tnum"}
.timer-number.warning{color:#e74c3c;animation:timerPulse 1s infinite}
@keyframes timerPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(1.03)}}
.timer-label{font-size:.85em;color:var(--muted);margin-top:6px}
.code-badge{display:inline-block;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:7px 20px;border-radius:20px;font-weight:700;font-size:1.1em;letter-spacing:5px;margin:8px 0;box-shadow:0 2px 8px rgba(212,128,128,.25)}
.order-item{display:flex;justify-content:space-between;align-items:center;padding:14px 12px;border-radius:12px;margin-bottom:6px;background:#fefdfa;border:1px solid transparent;transition:border-color .15s}
.order-item:hover{border-color:var(--border)}
.order-left{flex:1}
.order-code{font-size:.75em;color:var(--muted);margin-bottom:3px;letter-spacing:1px}
.order-name{font-weight:600;font-size:.95em}
.order-time{font-size:.82em;color:#9a9088;margin-top:3px}
.order-status{font-weight:600;font-size:.85em;padding:4px 10px;border-radius:12px;background:#f5f2ec}
.status-active{color:#27ae60}
.status-expired{color:#e74c3c}
.status-done{color:var(--muted)}
.admin-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.admin-bar .btn{flex:1;margin-top:0;font-size:.78em;padding:10px 6px;font-weight:500;min-width:0}
.package-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.package-btn{padding:16px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card);text-align:center;cursor:pointer;transition:all .15s}
.package-btn:hover{border-color:var(--c1);background:#fef8f6}
.package-btn:active{background:#fef5f5;border-color:var(--c1);transform:scale(.96)}
.pkg-name{font-weight:700;font-size:.95em;color:var(--text)}
.pkg-price{color:var(--c1);font-size:.85em;margin-top:3px;font-weight:600}
.dialog-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:flex-end}
.dialog-overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dialog{background:var(--card);border-radius:20px 20px 0 0;padding:28px 22px 22px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,.1)}
.dialog h3{font-size:1.1em;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.dialog label{font-size:.8em;color:var(--muted);display:block;margin-top:14px;font-weight:600}
.qr-wrap{text-align:center;padding:12px 0}
.qr-wrap img{border-radius:14px;max-width:200px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.qr-url{color:var(--muted);font-size:.75em;margin-top:10px;word-break:break-all;background:#fafaf8;padding:8px 12px;border-radius:8px;display:inline-block}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#3a3a3a;color:#fff;padding:11px 26px;border-radius:24px;font-size:.9em;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.15);font-weight:500;letter-spacing:.3px}
.toast.show{opacity:1}
.expired-tip{display:block;font-size:.85em;color:#d9534f;margin-top:8px;font-weight:500}
.empty-text{font-size:.95em;color:var(--muted);padding:32px 0;text-align:center;opacity:.7}
.merchant-item{display:flex;justify-content:space-between;align-items:center;padding:14px 12px;border-bottom:1px solid var(--border);transition:background .15s}
.merchant-item:last-child{border-bottom:0}
.merchant-item:hover{background:#fefdfa}
.merchant-info{flex:1;min-width:0}
.merchant-phone{font-weight:600;font-size:.95em}
.merchant-meta{font-size:.75em;color:var(--muted);margin-top:3px}
.merchant-actions{display:flex;gap:6px;flex-shrink:0}
.logo-icon{font-size:2.2em;display:block;margin-bottom:8px}
.footer-note{text-align:center;color:var(--muted);font-size:.75em;padding:8px 0 24px;opacity:.6}
.feature-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.feature-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 6px 10px;text-align:center;font-size:1.5em;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s}
.feature-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.feature-item div{font-size:.5em;color:var(--muted);margin-top:6px;font-weight:500}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ====== 顾客端 ====== -->
<div class="page active" id="page-customer">
  <div class="header">
    <h1>🧩 拼豆计时</h1>
    <div class="sub" id="customer-shop-name">加载中...</div>
  </div>
  <div class="card" id="card-code">
    <div class="card-title">请输入你的手机后4位</div>
    <input type="tel" id="input-code" placeholder="手机后4位" maxlength="4" inputmode="numeric" autofocus>
    <button class="btn btn-primary" onclick="customerLookup()">查看计时</button>
  </div>
  <div class="card" id="card-timer" style="display:none">
    <div style="text-align:center"><span class="code-badge" id="timer-code-badge"></span></div>
    <div class="timer-display" id="timer-display"></div>
    <div style="text-align:center;color:#999;font-size:.85em" id="timer-info"></div>
    <button class="btn btn-outline" onclick="customerReset()">查看其他订单</button>
  </div>
  <div class="card" id="card-not-found" style="display:none">
    <div class="empty-text">😕 订单不存在或已结束</div>
    <button class="btn btn-outline" onclick="customerReset()">重新输入</button>
  </div>
</div>

<!-- ====== 登录页 ====== -->
<div class="page" id="page-login">
  <div class="header"><span class="logo-icon">🧩</span><h1>拼豆计时器</h1><div class="sub">商家管理后台</div></div>
  
  <!-- 功能亮点 -->
  <div class="feature-row">
    <div class="feature-item">⏱️<div>自动计时</div></div>
    <div class="feature-item">📱<div>扫码查看</div></div>
    <div class="feature-item">📊<div>订单管理</div></div>
    <div class="feature-item">💾<div>一键导出</div></div>
  </div>

  <div class="card">
    <div class="card-title">手机号 + 密码登录</div>
    <input type="tel" id="login-phone" placeholder="手机号" maxlength="11" autofocus>
    <input type="password" id="login-pw" placeholder="密码">
    <button class="btn btn-primary" onclick="login()">登 录</button>
  </div>
  <div class="footer-note">拼豆手工坊专属计时系统 · 商家账号由管理员分配</div>
</div>

<!-- ====== 管理员面板 ====== -->
<div class="page" id="page-admin">
  <div class="header"><span class="logo-icon">⚙️</span><h1>管理后台</h1><div class="sub">管理员 · <span id="admin-name"></span></div></div>
  <div class="admin-bar">
    <button class="btn btn-primary" onclick="showAddMerchant()">+ 添加商家</button>
    <button class="btn btn-outline" onclick="logout()">退出</button>
  </div>
  <div class="card">
    <div class="card-title">商家列表</div>
    <div id="merchant-list">加载中...</div>
  </div>
</div>

<!-- ====== 商家面板 ====== -->
<div class="page" id="page-merchant">
  <div class="header"><span class="logo-icon">🧩</span><h1>拼豆计时</h1><div class="sub" id="merchant-shop-name"></div></div>
  <div class="admin-bar">
    <button class="btn btn-primary" onclick="showNewOrder()">+ 新订单</button>
    <button class="btn btn-outline" onclick="showQRCode()">📱 顾客入口</button>
    <button class="btn btn-outline" onclick="exportCSV()">📥 导出</button>
    <button class="btn btn-outline" onclick="showChangePwd()">🔒 改密</button>
    <button class="btn btn-outline" onclick="logout()" style="color:#999">退出</button>
  </div>
  <div class="card" id="card-no-shop" style="display:none">
    <div class="empty-text">还没有店铺</div>
    <input type="text" id="shop-name-input" placeholder="输入店铺名称">
    <button class="btn btn-primary" onclick="createShop()">创建店铺</button>
  </div>
  <div class="card" id="card-active-orders">
    <div class="card-title">🟢 进行中 (<span id="active-count">0</span>)</div>
    <div id="active-orders">暂无订单</div>
  </div>
  <div class="card">
    <div class="card-title">📋 已完成</div>
    <div id="done-orders">暂无记录</div>
  </div>
</div>

<!-- ====== 新订单弹窗 ====== -->
<div class="dialog-overlay" id="dlg-order"><div class="dialog">
  <h3 style="margin-bottom:16px">新订单</h3>
  <div class="package-grid" id="order-packages"></div>
  <label>手机后4位</label>
  <input type="tel" id="order-code" placeholder="客户手机后4位" maxlength="4" inputmode="numeric" style="letter-spacing:6px;text-align:center;font-size:1.2em">
  <label>类型</label>
  <select id="order-type"><option value="single">单人</option><option value="double">双人</option></select>
  <label>时长（分钟）</label>
  <input type="number" id="order-minutes" value="60" min="5" max="480" step="5">
  <label>价格（元）</label>
  <input type="number" id="order-price" value="14.9" min="0" step="0.1">
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-outline" onclick="closeDlg('dlg-order')" style="flex:1">取消</button>
    <button class="btn btn-primary" onclick="createOrder()" style="flex:1">确认下单</button>
  </div>
</div></div>

<!-- ====== 续时弹窗 ====== -->
<div class="dialog-overlay" id="dlg-extend"><div class="dialog">
  <h3 style="margin-bottom:16px">⏱ 续时</h3>
  <p style="color:#999;font-size:.85em;margin-bottom:12px" id="extend-info"></p>
  <label>续时（分钟）</label>
  <input type="number" id="extend-minutes" value="30" min="5" max="480" step="5">
  <label>追加价格（元）</label>
  <input type="number" id="extend-price" value="10" min="0" step="0.1">
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-outline" onclick="closeDlg('dlg-extend')" style="flex:1">取消</button>
    <button class="btn btn-primary" onclick="doExtend()" style="flex:1">确认续时</button>
  </div>
</div></div>

<!-- ====== 顾客入口弹窗 ====== -->
<div class="dialog-overlay" id="dlg-qr"><div class="dialog">
  <h3 style="text-align:center;margin-bottom:8px">📱 顾客入口</h3>
  <div class="qr-wrap" id="qr-content"></div>
  <button class="btn btn-outline" onclick="closeDlg('dlg-qr')">关闭</button>
</div></div>

<!-- ====== 添加商家弹窗 ====== -->
<div class="dialog-overlay" id="dlg-merchant"><div class="dialog">
  <h3 style="margin-bottom:16px">添加商家</h3>
  <input type="tel" id="new-merchant-phone" placeholder="手机号" maxlength="11">
  <input type="text" id="new-merchant-name" placeholder="商家名称（选填）">
  <input type="password" id="new-merchant-pw" placeholder="密码（默认123456）">
  <label style="font-size:.85em;color:#999;margin-top:8px;display:block">到期天数（默认365天）</label>
  <input type="number" id="new-merchant-days" value="365" min="1">
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-outline" onclick="closeDlg('dlg-merchant')" style="flex:1">取消</button>
    <button class="btn btn-primary" onclick="doAddMerchant()" style="flex:1">确认添加</button>
  </div>
</div></div>

<!-- ====== 续费弹窗 ====== -->
<div class="dialog-overlay" id="dlg-renew"><div class="dialog">
  <h3 style="margin-bottom:16px">续费</h3>
  <p style="color:#999;font-size:.85em;margin-bottom:12px" id="renew-info"></p>
  <label>选择天数</label>
  <div class="package-grid" style="margin-bottom:12px">
    <div class="package-btn" onclick="pickRenew(7)"><div class="pkg-name">7天</div></div>
    <div class="package-btn" onclick="pickRenew(15)"><div class="pkg-name">15天</div></div>
    <div class="package-btn" onclick="pickRenew(30)"><div class="pkg-name">30天</div></div>
    <div class="package-btn" onclick="pickRenew(90)"><div class="pkg-name">90天</div></div>
    <div class="package-btn" onclick="pickRenew(180)"><div class="pkg-name">180天</div></div>
    <div class="package-btn" onclick="pickRenew(365)"><div class="pkg-name">365天</div></div>
  </div>
  <label>自定义天数</label>
  <input type="number" id="renew-days" value="30" min="1">
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-outline" onclick="closeDlg('dlg-renew')" style="flex:1">取消</button>
    <button class="btn btn-primary" onclick="doRenew()" style="flex:1">确认续费</button>
  </div>
</div></div>

<!-- ====== 修改密码弹窗 ====== -->
<div class="dialog-overlay" id="dlg-chpwd"><div class="dialog">
  <h3 style="margin-bottom:16px">修改密码</h3>
  <label>旧密码</label>
  <input type="password" id="chpwd-old" placeholder="输入当前密码">
  <label>新密码</label>
  <input type="password" id="chpwd-new" placeholder="输入新密码">
  <label>确认新密码</label>
  <input type="password" id="chpwd-confirm" placeholder="再次输入新密码">
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn btn-outline" onclick="closeDlg('dlg-chpwd')" style="flex:1">取消</button>
    <button class="btn btn-primary" onclick="doChangePwd()" style="flex:1">确认修改</button>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const API='/api';
let token='',userRole='',userPhone='',currentShopId='',currentShopName='';

// ====== 工具 ======
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function closeDlg(id){$(id).classList.remove('show')}
async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(token) opts.headers.Authorization='Bearer '+token;
  if(body) opts.body=JSON.stringify(body);
  try{const r=await fetch(API+path,opts);const data=await r.json();return data}catch{return null}
}

// ====== 常量 ======
const PKG=[{name:'单人 1小时',price:14.9,minutes:60,type:'single'},{name:'双人 1小时',price:25,minutes:60,type:'double'},{name:'单人 不限时',price:39.9,minutes:0,type:'single'},{name:'双人 不限时',price:69.9,minutes:0,type:'double'}];

// ====== 登录 ======
async function login(){
  const phone=$('login-phone').value.trim(),pw=$('login-pw').value.trim();
  if(!phone||!pw) return toast('请输入手机号和密码');
  const r=await api('POST','/login',{phone,password:pw});
  if(!r||!r.ok) return toast(r?r.error:'登录失败');
  token=r.token;userRole=r.role;userPhone=r.phone;
  sessionStorage.setItem('pin_token',token);
  sessionStorage.setItem('pin_role',userRole);
  sessionStorage.setItem('pin_phone',userPhone);
  if(userRole==='admin') showAdmin();
  else showMerchant();
  document.getElementById('admin-name').textContent=r.name||userPhone;
}

function logout(){token='';userRole='';userPhone='';sessionStorage.clear();route()}
function showChangePwd(){$('dlg-chpwd').classList.add('show');$('chpwd-old').value='';$('chpwd-new').value='';$('chpwd-confirm').value=''}
async function doChangePwd(){
  const oldPw=$('chpwd-old').value.trim(),newPw=$('chpwd-new').value.trim(),cfm=$('chpwd-confirm').value.trim();
  if(!oldPw||!newPw) return toast('请填写新旧密码');
  if(newPw!==cfm) return toast('两次新密码不一致');
  if(newPw.length<4) return toast('新密码至少4位');
  const r=await api('POST','/change-password',{oldPassword:oldPw,newPassword:newPw});
  if(!r||!r.ok) return toast(r?r.error:'修改失败');
  toast('✅ 密码修改成功');closeDlg('dlg-chpwd');
}

// ====== 路由 ======
function route(){
  token=sessionStorage.getItem('pin_token')||'';
  userRole=sessionStorage.getItem('pin_role')||'';
  userPhone=sessionStorage.getItem('pin_phone')||'';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const p=new URLSearchParams(location.search);
  const shopId=p.get('shopId')||p.get('t')||p.get('id');

  if(shopId){ // 顾客模式
    currentShopId=shopId;$('page-customer').classList.add('active');initCustomer();
  }else if(userRole==='admin'){showAdmin();
  }else if(userRole==='merchant'){showMerchant();
  }else{$('page-login').classList.add('active')}
}

// ====== 管理员 ======
async function showAdmin(){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-admin').classList.add('active');
  $('admin-name').textContent=userPhone;
  await loadMerchants();
}
async function loadMerchants(){
  const r=await api('GET','/merchants');
  if(!r||!r.ok) return ($('merchant-list').innerHTML='<div class="empty-text">加载失败</div>');
  const ms=r.merchants;
  if(!ms.length) return ($('merchant-list').innerHTML='<div class="empty-text">暂无商家</div>');
  $('merchant-list').innerHTML=ms.map(m=>{
    const exp=m.expireTime?new Date(m.expireTime).toLocaleDateString('zh-CN'):'无';
    const st=m.status==='expired'?'🔴 已到期':m.status==='disabled'?'⚫ 已禁用':'🟢 正常';
    const isAdmin = m.role === 'admin';
    return `<div class="merchant-item">
      <div class="merchant-info"><div class="merchant-phone">${m.phone}${m.name?' · '+m.name:''}</div><div class="merchant-meta">${st} · 到期:${exp} · 角色:${m.role}</div></div>
      <div class="merchant-actions">
        ${isAdmin ? '' : `<button class="btn btn-sm btn-outline" onclick="showRenew('${m.phone}')">续费</button>
        <button class="btn btn-sm btn-danger" onclick="disableMerchant('${m.phone}')">禁用</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMerchant('${m.phone}')">删除</button>`}
      </div></div>`;
  }).join('');
}
function showAddMerchant(){$('dlg-merchant').classList.add('show')}
async function doAddMerchant(){
  const phone=$('new-merchant-phone').value.trim(),name=$('new-merchant-name').value.trim(),pw=$('new-merchant-pw').value.trim()||'123456',days=parseInt($('new-merchant-days').value)||365;
  if(!phone) return toast('请填写手机号');
  const r=await api('POST','/merchants',{phone,name,password:pw,days,action:'add'});
  if(!r||!r.ok) return toast(r?r.error:'添加失败');
  toast('✅ 添加成功');closeDlg('dlg-merchant');loadMerchants();
}
let renewPhone='';
function showRenew(phone){renewPhone=phone;$('renew-info').textContent='商家: '+phone;$('dlg-renew').classList.add('show');$('renew-days').value=30}
function pickRenew(d){$('renew-days').value=d}
async function doRenew(){
  const days=parseInt($('renew-days').value)||30;
  const r=await api('POST','/merchants',{phone:renewPhone,days,action:'renew'});
  if(!r||!r.ok) return toast(r?r.error:'续费失败');
  toast('✅ 续费成功');closeDlg('dlg-renew');loadMerchants();
}
async function disableMerchant(phone){
  if(!confirm('确定禁用 '+phone+'？')) return;
  await api('POST','/merchants',{phone,action:'disable'});loadMerchants();
}
async function deleteMerchant(phone){
  if(!confirm('确定删除 '+phone+'？此操作不可恢复！')) return;
  if(!confirm('再次确认删除？')) return;
  await api('POST','/merchants',{phone,action:'delete'});loadMerchants();
}

// ====== 商家 ======
async function showMerchant(){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-merchant').classList.add('active');
  const r=await api('GET','/shops');
  if(!r||!r.ok) return toast('加载店铺失败');
  const shops=r.shops.filter(s=>s.status==='active');
  if(!shops.length){
    $('card-no-shop').style.display='block';$('card-active-orders').style.display='none';
  }else{
    $('card-no-shop').style.display='none';$('card-active-orders').style.display='block';
    currentShopId=shops[0].id;currentShopName=shops[0].name;
    $('merchant-shop-name').textContent=currentShopName;
    sessionStorage.setItem('shopId',currentShopId);sessionStorage.setItem('shopName',currentShopName);
    renderOrders();renderPackages();
  }
}
async function createShop(){
  const name=$('shop-name-input').value.trim()||'拼豆手工坊';
  const r=await api('POST','/shops',{name});
  if(!r||!r.ok) return toast(r?r.error:'创建失败');
  toast('✅ 店铺创建成功');showMerchant();
}
function renderPackages(){
  $('order-packages').innerHTML=PKG.map(p=>`<div class="package-btn" onclick="pickPkg(${p.minutes},${p.price},'${p.type}')"><div class="pkg-name">${p.name}</div><div class="pkg-price">¥${p.price}</div></div>`).join('');
}
function pickPkg(m,p,t){$('order-minutes').value=m;$('order-price').value=p;$('order-type').value=t}
function showNewOrder(){if(!currentShopId) return toast('请先创建店铺');$('dlg-order').classList.add('show')}

async function createOrder(){
  const code=$('order-code').value.trim();
  if(!/^\d{4}$/.test(code)) return toast('请输入4位手机尾号');
  const m=parseInt($('order-minutes').value)||60,p=parseFloat($('order-price').value)||0,t=$('order-type').value;
  const r=await api('POST','/orders',{shopId:currentShopId,code,minutes:m,price:p,type:t});
  if(!r||!r.ok) return toast(r?r.error:'下单失败');
  toast('✅ 下单成功 · '+code);closeDlg('dlg-order');renderOrders();
}

async function renderOrders(){
  const r=await api('GET','/orders?shopId='+currentShopId);
  const orders=r&&r.ok?r.orders:[];
  const active=orders.filter(o=>o.status==='active'),done=orders.filter(o=>o.status!=='active');
  $('active-count').textContent=active.length;
  $('active-orders').innerHTML=active.length?active.map(o=>renderOrderItem(o,true)).join(''):'<div class="empty-text">暂无进行中的订单</div>';
  $('done-orders').innerHTML=done.length?done.slice(0,20).map(o=>renderOrderItem(o,false)).join(''):'<div class="empty-text">暂无记录</div>';
}
function renderOrderItem(o,isActive){
  const endAt=o.minutes>0?o.startTime+o.minutes*60000:null;
  const remain=endAt?Math.max(0,Math.ceil((endAt-Date.now())/1000)):null;
  const rs=remain===null?'不限时♾️':remain<=0?'已到期':Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');
  const expired=endAt&&Date.now()>=endAt;
  return `<div class="order-item"><div class="order-left">
    <div class="order-code">${o.code}</div>
    <div class="order-name">${o.type==='double'?'👥双人':'👤单人'} · ¥${o.price} · ${o.minutes>0?o.minutes+'分钟':'不限时'}</div>
    <div class="order-time">${rs}</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    ${isActive?`<span class="order-status ${expired?'status-expired':'status-active'}">${expired?'⚠️到期':rs}</span>
    <button class="btn btn-sm btn-danger" onclick="completeOrder('${o.code}')">完成</button>
    ${o.minutes>0?`<button class="btn btn-sm btn-primary" onclick="showExtend('${o.code}')">续时</button>`:''}`:'<span class="order-status status-done">✅完成</span>'}
    </div></div>`;
}

async function completeOrder(code){
  if(!confirm('确定完成手机尾号 '+code+'？')) return;
  await api('POST','/orders/complete',{shopId:currentShopId,code});renderOrders();
}
let extendCode='';
function showExtend(code){extendCode=code;$('extend-info').textContent='手机尾号: '+code;$('dlg-extend').classList.add('show')}
async function doExtend(){
  const m=parseInt($('extend-minutes').value)||30,p=parseFloat($('extend-price').value)||0;
  if(!confirm(`续时 ${m} 分钟，¥${p}？`)) return;
  const r=await api('POST','/orders/extend',{shopId:currentShopId,code:extendCode,minutes:m,price:p});
  if(!r||!r.ok) return toast(r?r.error:'续时失败');
  toast('✅ 续时成功');closeDlg('dlg-extend');renderOrders();
}
function showQRCode(){
  $('dlg-qr').classList.add('show');
  const url=location.origin+location.pathname+'?shopId='+currentShopId;
  const qrImg=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=212-128-128&data=${encodeURIComponent(url)}`;
  $('qr-content').innerHTML=`<img src="${qrImg}" alt="二维码" onerror="this.onerror=null;this.nextSibling.style.display='block';this.style.display='none'"><div style="display:none;font-family:monospace;font-size:.7em;color:#999;word-break:break-all;margin-top:8px">${url}</div><p style="margin-top:8px;color:#d48080;font-weight:600">📱 顾客扫码输入手机后4位查看计时</p>`;
}
async function exportCSV(){
  const r=await api('GET','/orders?shopId='+currentShopId);
  if(!r||!r.ok||!r.orders.length) return toast('暂无数据');
  let csv='\uFEFF订单号,类型,价格,时长,状态,时间\n';
  r.orders.forEach(o=>{csv+=`${o.code},${o.type==='double'?'双人':'单人'},${o.price},${o.minutes||'不限时'},${o.status==='active'?'进行中':'已完成'},${new Date(o.startTime).toLocaleString('zh-CN')}\n`});
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='拼豆订单_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('✅ 已导出');
}

// ====== 顾客端 ======
let customerTimer=null,customerOrder=null;
async function initCustomer(){
  try{const r=await api('GET','/shops/'+currentShopId);if(r&&r.ok)$('customer-shop-name').textContent=r.shop.name}catch(e){}
}
async function customerLookup(){
  const code=$('input-code').value.trim();
  if(!/^\d{4}$/.test(code)) return toast('请输入4位手机尾号');
  const r=await api('GET','/orders/lookup?shopId='+currentShopId+'&code='+code);
  if(!r||!r.ok) return ($('card-code').style.display='none',$('card-timer').style.display='none',$('card-not-found').style.display='block');
  customerOrder=r.order;$('card-code').style.display='none';$('card-not-found').style.display='none';$('card-timer').style.display='block';
  $('timer-code-badge').textContent=code;
  $('timer-info').textContent=(customerOrder.type==='double'?'双人':'单人')+' · ¥'+customerOrder.price+' · '+(customerOrder.minutes>0?customerOrder.minutes+'分钟':'不限时');
  if(customerTimer)clearInterval(customerTimer);
  if(customerOrder.minutes===0){
    $('timer-display').innerHTML='<div class="timer-number" style="font-size:3em">♾️</div><div class="timer-label">不限时畅玩</div>';
    customerTimer=setInterval(checkCustomerStatus,5000);
  }else{
    updateCustomerTimer();customerTimer=setInterval(updateCustomerTimer,1000);
  }
}
function updateCustomerTimer(){
  if(!customerOrder||customerOrder.minutes===0)return;
  const end=customerOrder.startTime+customerOrder.minutes*60000,remain=Math.max(0,Math.ceil((end-Date.now())/1000));
  if(remain<=0){
    $('timer-display').innerHTML='<div class="timer-number warning">00:00</div><div class="timer-label">⏰ 时间到！</div><div class="expired-tip">请到吧台结账或续时</div>';
  }else{
    const m=Math.floor(remain/60),s=remain%60,w=remain<=300?' warning':'';
    $('timer-display').innerHTML=`<div class="timer-number${w}">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div class="timer-label">剩余时间</div>`;
  }
  if(Math.floor(Date.now()/1000)%5===0) checkCustomerStatus();
}
async function checkCustomerStatus(){
  const r=await api('GET','/orders/lookup?shopId='+currentShopId+'&code='+(customerOrder?customerOrder.code:''));
  if(!r||!r.ok){if(customerTimer)clearInterval(customerTimer);customerReset()}
}
function customerReset(){$('card-code').style.display='block';$('card-timer').style.display='none';$('card-not-found').style.display='none';if(customerTimer)clearInterval(customerTimer);$('input-code').value='';customerOrder=null;$('input-code').focus()}

// ====== 自动刷新 ======
let refreshBusy=false;
setInterval(async()=>{if(refreshBusy||!currentShopId||!$('page-merchant').classList.contains('active'))return;refreshBusy=true;await renderOrders();refreshBusy=false},3000);

// ====== 启动 ======
route();
</script>
